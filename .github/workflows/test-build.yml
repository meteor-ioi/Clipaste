name: Test Build (Unsigned)

on:
  push:
    branches:
      - feature/snippet-shortcuts
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Build unsigned app
        run: |
          xcodebuild -project clipaste.xcodeproj \
                     -scheme clipaste \
                     -configuration Debug \
                     -derivedDataPath build_derived \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Compress App
        run: |
          cd build_derived/Build/Products/Debug
          zip -r ../../../../Clipaste-Test-Unsigned.zip clipaste.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clipaste-Test-Unsigned
          path: Clipaste-Test-Unsigned.zip
          if-no-files-found: error
